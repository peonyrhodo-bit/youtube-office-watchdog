name: Wake Services

on:
  schedule:
    - cron: "*/13 * * * *"

  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest

    steps:
      - name: Wake YouTube MCP
        env:
          WAKE_URL: ${{ vars.YOUTUBE_MCP_WAKE_URL }}
        run: |
          if [ -z "$WAKE_URL" ]; then
            echo "YOUTUBE_MCP_WAKE_URL is not configured"
            exit 1
          fi

          echo "Waking YouTube MCP..."

          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 30 \
            "$WAKE_URL"

          echo
          echo "YouTube MCP wake request completed."

      - name: Wake Second Service
        env:
          WAKE_URL: ${{ vars.SECOND_SERVICE_WAKE_URL }}
        run: |
          if [ -z "$WAKE_URL" ]; then
            echo "SECOND_SERVICE_WAKE_URL is not configured"
            exit 1
          fi

          echo "Waking second service..."

          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 30 \
            "$WAKE_URL"

          echo
          echo "Second service wake request completed."

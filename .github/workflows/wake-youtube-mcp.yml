```yaml
name: YouTube Office Watchdog

on:
  schedule:
    - cron: "*/12 * * * *"

  workflow_dispatch:

jobs:
  wake-services:
    runs-on: ubuntu-latest

    steps:
      - name: Wake all Render services
        shell: bash
        run: |
          set -u

          MAX_ATTEMPTS=5
          RETRY_DELAY=15

          SERVICES=(
            "YouTube MCP|https://youtube-mcp-u39z.onrender.com/"
            "AI YouTube System|https://ai-youtube-system.onrender.com/"
            "Site Insight Engine|https://site-insight-engine.onrender.com/health"
          )

          FAILED=0

          for SERVICE in "${SERVICES[@]}"; do
            NAME="${SERVICE%%|*}"
            URL="${SERVICE#*|}"

            echo
            echo "========================================"
            echo "Service: ${NAME}"
            echo "URL: ${URL}"
            echo "========================================"

            SUCCESS=0

            for ATTEMPT in $(seq 1 "$MAX_ATTEMPTS"); do
              echo "Attempt ${ATTEMPT}/${MAX_ATTEMPTS}..."

              HTTP_CODE=$(curl \
                --connect-timeout 10 \
                --max-time 30 \
                --silent \
                --show-error \
                --output /dev/null \
                --write-out "%{http_code}" \
                "$URL" \
                || echo "000")

              echo "HTTP response: ${HTTP_CODE}"

              if [[ "$HTTP_CODE" != "000" ]] && [[ "$HTTP_CODE" -lt 500 ]]; then
                echo "OK: ${NAME} responded."
                SUCCESS=1
                break
              fi

              if [[ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]]; then
                echo "No usable response yet."
                echo "Waiting ${RETRY_DELAY} seconds before retry..."
                sleep "$RETRY_DELAY"
              fi
            done

            if [[ "$SUCCESS" -eq 0 ]]; then
              echo
              echo "ERROR: ${NAME} did not respond after ${MAX_ATTEMPTS} attempts."
              FAILED=1
            fi
          done

          echo
          echo "========================================"

          if [[ "$FAILED" -eq 0 ]]; then
            echo "WATCHDOG RESULT: ALL SERVICES RESPONDED"
            echo "========================================"
            exit 0
          fi

          echo "WATCHDOG RESULT: ONE OR MORE SERVICES FAILED"
          echo "========================================"
          exit 1
```

name: Keep Render Services Awake - Second Alarm

on:
  # Run once after changes to this workflow are pushed to the default branch.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/schedule-diagnostic.yml"
  # Second hourly ping at minute 37, half an hour after the primary alarm.
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-keep-awake
  cancel-in-progress: false

jobs:
  ping-services:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping all three Render services in parallel
        shell: bash
        run: |
          ping_service() {
            name="$1"
            url="$2"
            code=$(curl --silent --show-error --location --max-time 40 --output /dev/null --write-out "%{http_code}" "$url" 2>/dev/null) || code="request_failed"
            echo "$name: HTTP $code"
          }

          ping_service "Main website" "https://site-insight-engine.onrender.com/" &
          pid1=$!
          ping_service "AI YouTube System" "https://ai-youtube-system.onrender.com/" &
          pid2=$!
          ping_service "YouTube MCP" "https://youtube-mcp-u39z.onrender.com/" &
          pid3=$!

          wait "$pid1"
          wait "$pid2"
          wait "$pid3"

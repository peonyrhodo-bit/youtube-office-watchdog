name: Render Keep Alive

on:
  schedule:
    # Every 5 minutes, offset from the top of the hour to reduce GitHub Actions load-related delays.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

jobs:
  wake-render-services:
    runs-on: ubuntu-latest

    steps:
      - name: Wake all three Render services in parallel
        shell: bash
        run: |
          set -u

          services=(
            "site-insight-engine|https://site-insight-engine.onrender.com/"
            "ai-youtube-system|https://ai-youtube-system.onrender.com/"
            "youtube-mcp-u39z|https://youtube-mcp-u39z.onrender.com/"
          )

          pids=()

          for service in "${services[@]}"; do
            name="${service%%|*}"
            url="${service#*|}"

            (
              echo "Waking ${name}..."

              if curl \
                --location \
                --connect-timeout 15 \
                --max-time 120 \
                --silent \
                --show-error \
                --output /dev/null \
                --write-out "${name}: HTTP %{http_code} — request completed\n" \
                --retry 2 \
                --retry-delay 5 \
                --retry-all-errors \
                "${url}"
              then
                echo "${name}: wake-up request finished."
              else
                echo "${name}: wake-up request FAILED."
                exit 1
              fi
            ) &

            pids+=($!)
          done

          failed=0
          for pid in "${pids[@]}"; do
            if ! wait "${pid}"; then
              failed=1
            fi
          done

          if [ "${failed}" -eq 0 ]; then
            echo "All three wake-up requests completed successfully."
          else
            echo "One or more wake-up requests failed."
            exit 1
          fi
